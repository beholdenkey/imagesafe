---
remotes:
  - git_url: https://github.com/apeiros-innovations/common.git
    # renovate: datasource=git-refs depName=https://github.com/apeiros-innovations/common.git
    ref: 909c0d34e9a626138a1e1951c763b261ab942754
    configs:
      - lefthook.common.yaml
      - lefthook.github.yaml
      - lefthook.container.yaml
      - lefthook.renovate.yaml

# Common currently matches .config/mise; this project uses the .mise layout.
pre-commit:
  jobs:
    - name: imagesafe mise
      glob:
        - ".mise/config.toml"
        - ".mise/conf.d/*.toml"
        - ".mise/mise.lock"
      run: mise fmt && mise lock
      stage_fixed: true
      tags:
        - mise
        - generation
