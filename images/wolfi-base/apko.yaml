---
# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/apko/main/pkg/build/types/schema.json
include: images/base/common.yaml
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - ca-certificates-bundle
    - wolfi-base

annotations:
  org.opencontainers.image.title: "Wolfi base"
  org.opencontainers.image.description: "A nonroot Wolfi base image for interactive tools."
  org.opencontainers.image.documentation: "https://github.com/wolfi-dev/os"

entrypoint:
  command: /bin/sh
cmd: -l
