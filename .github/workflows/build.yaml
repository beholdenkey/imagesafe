---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build
on:
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: imagesafe-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: "2026.10.0"
          install_args: --locked
      - run: mise run setup
      - run: mise run check
  select:
    name: Select changed images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      builds: ${{ steps.matrix.outputs.builds }}
      packages: ${{ steps.matrix.outputs.packages }}
      package_count: ${{ steps.matrix.outputs.package_count }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/images.py matrix
  packages:
    name: Package and test (${{ matrix.name }}, ${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.package_count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: "2026.10.0"
          install_args: --locked aqua:chainguard-dev/melange
      - name: Build a signed source package
        env:
          RECIPE: ${{ matrix.recipe }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/package.sh build "$RECIPE" "$ARCH"
      - name: Test the packaged application
        env:
          RECIPE: ${{ matrix.recipe }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/package.sh test "$RECIPE" "$ARCH"
      - name: Preserve packages, provenance, and public keys
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-${{ matrix.name }}-${{ matrix.arch }}
          path: build/packages/
          if-no-files-found: error
          retention-days: 30
  resolve:
    name: Resolve exact image package inputs
    needs:
      - select
      - packages
    if: always() && needs.select.result == 'success' && (needs.packages.result == 'success' || needs.packages.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      images: ${{ needs.select.outputs.images }}
      builds: ${{ needs.select.outputs.builds }}
      package_count: ${{ needs.select.outputs.package_count }}
      count: ${{ needs.select.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        if: needs.select.outputs.count != '0'
        with:
          version: "2026.10.0"
          install_args: --locked aqua:chainguard-dev/apko
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.select.outputs.package_count != '0'
        with:
          pattern: apk-*
          merge-multiple: true
          path: build/packages
      - name: Refresh packages for nightly and manual rebuilds
        if: needs.select.outputs.count != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python3 scripts/images.py lock
      - name: Lock the freshly built OpenTofu package
        if: needs.select.outputs.package_count != '0' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: python3 scripts/images.py lock opentofu
      - name: Preserve the exact package inputs
        if: needs.select.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-locks
          path: images/*/apko.lock.json
          if-no-files-found: error
          retention-days: 30
  build:
    name: Build and test (${{ matrix.name }}, ${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: "2026.10.0"
          install_args: --locked aqua:chainguard-dev/apko aqua:aquasecurity/trivy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apk-locks
          path: images
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.name == 'opentofu'
        with:
          pattern: apk-opentofu-*
          merge-multiple: true
          path: build/packages
      - name: Build from the resolved package lock
        env:
          IMAGE: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/images.py build "$IMAGE" --arch "$ARCH"
      - name: Test the native image as nonroot
        env:
          IMAGE: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/images.py test "$IMAGE" --arch "$ARCH"
      - name: Scan for vulnerabilities
        env:
          IMAGE: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/images.py scan "$IMAGE" --arch "$ARCH"
      - name: Preserve SBOM and scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            build/${{ matrix.name }}/${{ matrix.arch }}/*.json
          if-no-files-found: warn
          retention-days: 30
  checks:
    name: Image checks
    needs:
      - validate
      - resolve
      - build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful validation and selected builds
        env:
          VALIDATE: ${{ needs.validate.result }}
          RESOLVE: ${{ needs.resolve.result }}
          BUILD: ${{ needs.build.result }}
          COUNT: ${{ needs.resolve.outputs.count }}
        run: |
          test "$VALIDATE" = success
          test "$RESOLVE" = success
          if [ "$COUNT" != 0 ]; then
            test "$BUILD" = success
          fi
  publish:
    name: Publish (${{ matrix.name }})
    needs:
      - resolve
      - checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.resolve.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: "2026.10.0"
          install_args: --locked aqua:chainguard-dev/apko aqua:sigstore/cosign
          cache_save: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apk-locks
          path: images
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.name == 'opentofu'
        with:
          pattern: apk-opentofu-*
          merge-multiple: true
          path: build/packages
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested package set
        env:
          IMAGE: ${{ matrix.name }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
        run: python3 scripts/images.py publish "$IMAGE"
      - name: Sign images and attest the index SBOM
        env:
          IMAGE: ${{ matrix.name }}
        run: |
          while IFS= read -r ref; do
            cosign sign --yes "$ref"
          done < "build/$IMAGE/publish/image-refs.txt"
          index=$(tail -n 1 "build/$IMAGE/publish/image-refs.txt")
          cosign attest --yes --type spdxjson \
            --predicate "build/$IMAGE/publish/sbom-index.spdx.json" "$index"
          printf 'Published %s\n' "$index" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve published image references and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-${{ matrix.name }}
          path: build/${{ matrix.name }}/publish/
          if-no-files-found: warn
          retention-days: 30
